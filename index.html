<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D AI Partner Web with Firebase Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; overflow: hidden; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .interactive { pointer-events: auto; }
    
    .panel { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); max-width: 360px; width: 100%; }
    .panel h2 { font-size: 1.1rem; margin-bottom: 10px; color: #00d2ff; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc; }
    input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.85rem; }
    button { background: #00d2ff; color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 5px; }
    button:hover { background: #00a2ff; }
    
    /* Auth Buttons */
    .btn-google { background: #4285F4; color: #fff; }
    .btn-google:hover { background: #357ae8; }
    .btn-apple { background: #000000; color: #fff; border: 1px solid #555; }
    .btn-apple:hover { background: #222222; }
    .btn-logout { background: #ff4757; color: #fff; }

    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; }

    .chat-box { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; max-width: 600px; width: 100%; margin: 0 auto; margin-bottom: 20px; }
    .messages { max-height: 200px; overflow-y: auto; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .msg { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.4; }
    .msg.user { color: #87ceeb; text-align: right; }
    .msg.ai { color: #ffffff; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex-grow: 1; }
    .input-row button { width: auto; }
    
    .drop-zone { border: 2px dashed #00d2ff; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 0.8rem; color: #aaa; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.2/lib/three-vrm.module.js",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="panel interactive">
      <h2>👤 アカウント & 設定</h2>
      
      <!-- 未ログイン時の表示 -->
      <div id="auth-logged-out">
        <button id="btn-google-login" class="btn-google">Googleでログイン</button>
        <button id="btn-apple-login" class="btn-apple">Appleでログイン</button>
      </div>

      <!-- ログイン時の表示 -->
      <div id="auth-logged-in" class="hidden">
        <div class="user-info">
          <img id="user-photo" class="user-avatar" src="" alt="avatar">
          <span id="user-name" style="font-size:0.9rem;"></span>
        </div>
        <button id="btn-logout" class="btn-logout">ログアウト</button>
      </div>

      <hr style="margin: 15px 0; border:0; border-top: 1px solid rgba(255,255,255,0.1);">

      <div class="input-group">
        <label for="character-select">キャラクター切り替え</label>
        <select id="character-select">
          <option value="marisa">霧雨魔理沙</option>
          <option value="miku">初音ミク</option>
        </select>
      </div>

      <div class="input-group">
        <label for="api-key">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="AI Studioのキーを入力">
      </div>

      <div class="input-group">
        <label>3Dモデル (.vrm)</label>
        <div class="drop-zone" id="drop-zone">.vrm ファイルを選択</div>
        <input type="file" id="file-input" accept=".vrm" style="display:none;">
      </div>
    </div>

    <div class="chat-box interactive">
      <div class="messages" id="messages">
        <div class="msg ai">AI: ログインしてもそのままでも話せるぜ！</div>
      </div>
      <div class="input-row">
        <input type="text" id="user-input" placeholder="メッセージを入力...">
        <button id="send-btn">送信</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { initializeApp } from 'firebase/app';
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      OAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from 'firebase/auth';

    // --- 1. Firebase Auth Setup ---
    // ▼▼▼ ここにご自身の Firebase 設定オブジェクトを貼り付けてください ▼▼▼
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loggedOutDiv = document.getElementById('auth-logged-out');
    const loggedInDiv = document.getElementById('auth-logged-in');
    const userNameSpan = document.getElementById('user-name');
    const userPhotoImg = document.getElementById('user-photo');

    // Google Login
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert('Googleログインエラー: ' + err.message);
      }
    });

    // Apple Login
    document.getElementById('btn-apple-login').addEventListener('click', async () => {
      const provider = new OAuthProvider('apple.com');
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert('Appleログインエラー: ' + err.message);
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loggedOutDiv.classList.add('hidden');
        loggedInDiv.classList.remove('hidden');
        userNameSpan.textContent = user.displayName || user.email;
        userPhotoImg.src = user.photoURL || 'https://via.placeholder.com/32';
      } else {
        loggedOutDiv.classList.remove('hidden');
        loggedInDiv.classList.add('hidden');
      }
    });

    // --- 2. Three.js / VRM Engine ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.4, 1.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 1.3, 0.0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(1.0, 1.0, 1.0).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    let currentVrm = null;
    const clock = new THREE.Clock();
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function loadVRM(url) {
      loader.load(url, (gltf) => {
        const vrm = gltf.userData.vrm;
        if (currentVrm) {
          scene.remove(currentVrm.scene);
          VRMUtils.deepDispose(currentVrm.scene);
        }
        currentVrm = vrm;
        scene.add(vrm.scene);
        VRMUtils.rotateVRM0(vrm);
      });
    }

    loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Sample.vrm');

    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) currentVrm.update(clock.getDelta());
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadVRM(URL.createObjectURL(file));
    });

    // --- 3. Chat Logic ---
    const prompts = {
      marisa: `あなたは東方Projectの「霧雨魔理沙」です。語尾に「〜だぜ」等をつけ男勝りに短く答えてください。`,
      miku: `あなたはバーチャルシンガーの「初音ミク」です。明るく親しみやすい口調で短く答えてください。`
    };

    async function fetchGeminiResponse(userText) {
      const apiKey = document.getElementById('api-key').value.trim();
      if (!apiKey) return 'Gemini APIキーを入力してくれ！';

      const charType = document.getElementById('character-select').value;
      const systemPrompt = prompts[charType];
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: `${systemPrompt}\n\nユーザー: ${userText}` }] }]
          })
        });
        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return '通信エラーが発生したぜ。';
      }
    }

    const messages = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = `あなた: ${text}`;
      messages.appendChild(userMsg);
      userInput.value = '';

      const reply = await fetchGeminiResponse(text);
      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      aiMsg.textContent = `AI: ${reply}`;
      messages.appendChild(aiMsg);
      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
  </script>
</body>
</html>
